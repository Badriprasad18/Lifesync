services:
  - type: web
    name: lifesync-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: DATABASE_URL
        value: sqlite:///./lifesync.db
